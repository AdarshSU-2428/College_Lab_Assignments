<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            }

            .card {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            width: 300px;
            text-align: center;
            }

            .card input[type="text"],
            .card input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            }

            .card button {
            background-color: green;
            color: white;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            }

            .card button:hover {
            background-color: darkgreen;
            }

            .card label {
            display: flex;
            align-items: center;
            margin: 10px 0;
            }

            .card label input {
            margin-right: 5px;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h2>Login</h2>
            <input type="text" placeholder="Username">
            <input type="password" placeholder="Password">
            <label><input type="checkbox"> Remember Me</label>
            <button>Login</button>
        </div>
    </body>
</html>
