<!DOCTYPE html>
<html>
<head>
    <title>Student Information Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse; 
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .profile-pic {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <h2>Student Details</h2>
    <table>
        <thead>
            <tr>
                <th>Roll Number</th>
                <th>Name</th>
                <th>Email</th>
                <th>Mobile Number</th>
                <th>Profile Photo</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>101</td>
                <td>John Doe</td>
                <td><a href="mailto:john.doe@example.com">john.doe@example.com</a></td>
                <td>+1 234-567-8901</td>
                <td><img src="https://via.placeholder.com/50" alt="John Doe" class="profile-pic"></td>
            </tr>
            <tr>
                <td>102</td>
                <td>Jane Smith</td>
                <td><a href="mailto:jane.smith@example.com">jane.smith@example.com</a></td>
                <td>+1 987-654-3210</td>
                <td><img src="https://via.placeholder.com/50" alt="Jane Smith" class="profile-pic"></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
