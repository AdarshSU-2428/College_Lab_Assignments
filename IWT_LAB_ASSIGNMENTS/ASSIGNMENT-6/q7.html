<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>
<style>
body {
    font-family: sans-serif;
    margin: 20px;
    line-height: 1.6;
}
.form-container {
    max-width: 400px;
    border: 1px solid #ccc;
    padding: 20px;
    border-radius: 8px;
}
.form-group {
    margin-bottom: 15px;
}
label {
    font-weight: bold;
    display: block;
    margin-bottom: 5px;
}
input[type="text"],
input[type="password"],
input[type="email"],
input[type="tel"],
textarea, select {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
}
.error {
    color: red;
    font-size: 0.85em;
    display: block;
    margin-top: 5px;
}
button {
    background: #28a745;
    color: white;
    padding: 10px 15px;
    border: none;
    cursor: pointer;
    border-radius: 4px;
}
button:hover {
    background: #218838;
}
</style>
</head>
<body>
<div class="form-container">
<h2>Register</h2>
<form id="regForm">
<div class="form-group">
<label for="name">Name</label>
<input type="text" id="name" required>
<span id="nameErr" class="error"></span>
</div>

<div class="form-group">
<label>Gender</label>
<label><input type="radio" name="gender" value="Male"> Male</label>
<label><input type="radio" name="gender" value="Female"> Female</label>
<span id="genderErr" class="error"></span>
</div>

<div class="form-group">
<label for="mobile">Mobile</label>
<input type="tel" id="mobile" required>
<span id="mobileErr" class="error"></span>
</div>

<div class="form-group">
<label for="address">Address</label>
<textarea id="address" rows="3" required></textarea>
<span id="addressErr" class="error"></span>
</div>

<div class="form-group">
<label for="country">Country</label>
<select id="country" required>
<option value="">--Select--</option>
<option value="India">India</option>
<option value="USA">USA</option>
<option value="UK">UK</option>
</select>
<span id="countryErr" class="error"></span>
</div>

<div class="form-group">
<label for="email">Email</label>
<input type="email" id="email" required>
<span id="emailErr" class="error"></span>
</div>

<div class="form-group">
<label for="password">Password</label>
<input type="password" id="password" required>
<span id="passwordErr" class="error"></span>
</div>

<button type="submit">Submit</button>
</form>
</div>

<script>
document.getElementById('regForm').addEventListener('submit', function(e) {
e.preventDefault();

document.querySelectorAll('.error').forEach(err => err.innerHTML = "");

let isValid = true;

const name = document.getElementById('name').value.trim();
const gender = document.querySelector('input[name="gender"]:checked');
const mobile = document.getElementById('mobile').value.trim();
const address = document.getElementById('address').value.trim();
const country = document.getElementById('country').value;
const email = document.getElementById('email').value.trim();
const password = document.getElementById('password').value.trim();

if (!name) {
    document.getElementById('nameErr').innerText = "Name is required";
    isValid = false;
}

if (!gender) {
    document.getElementById('genderErr').innerText = "Select gender";
    isValid = false;
}

if (!address) {
    document.getElementById('addressErr').innerText = "Address is required";
    isValid = false;
}

if (!country) {
    document.getElementById('countryErr').innerText = "Select country";
    isValid = false;
}

const mobileRegex = /^[0-9]{10}$/;
if (!mobileRegex.test(mobile)) {
    document.getElementById('mobileErr').innerText = "Enter a valid 10-digit number";
    isValid = false;
}

const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
if (!emailRegex.test(email)) {
    document.getElementById('emailErr').innerText = "Enter a valid email address";
    isValid = false;
}

if (password.length < 6 || password.length > 15) {
    document.getElementById('passwordErr').innerText = "Password must be 6-15 characters";
    isValid = false;
}

if (isValid) {
    alert("Registration successful!");
    this.reset();
}
});
</script>

</body>
</html>
