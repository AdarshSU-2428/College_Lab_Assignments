<!DOCTYPE html>
<html>
    <head>
        <title>Profile Card</title>
        <style>
            body {
                background-color: #f2f2f2;
                font-family: Arial;
            }

            .card {
                width: 300px;
                margin: 50px auto;
                background: white;
                padding: 20px;
                border-radius: 10px;
                text-align: center;
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            }

            .card img {
                width: 120px;
                height: 120px;
                border-radius: 50%;
                border: 4px solid green;
            }

            .card h2 {
                margin: 10px 0;
            }

            .card p {
                color: gray;
                font-size: 14px;
            }

            .info {
                margin-top: 10px;
                font-size: 14px;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <img src="photos/images.jpg" alt="Profile">
            <h2>John Doe</h2>
            <p>A passionate web developer who loves building interactive websites.</p>
            
            <div class="info">
                📧 john.doe@example.com <br>
                📞 +91-9876543210
            </div>
        </div>
    </body>
</html>
