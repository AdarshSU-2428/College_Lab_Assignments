<!DOCTYPE html>
<html>
<head>
<title>Currency Converter</title>

<style>
.converter-card {
    width: 300px;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-family: Arial, sans-serif;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

select, input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 12px;
    background-color: black;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

button:hover {
    background-color: #333;
}
</style>
</head>

<body>

<div class="converter-card">
<h2>Currency Converter</h2>

<p id="error-message" style="color: red; font-size: 14px;"></p>

<label>From:</label>
<select id="fromCurrency">
<option value="USD">USD</option>
<option value="EUR">EUR</option>
<option value="GBP">GBP</option>
<option value="INR">INR</option>
<option value="AUD">AUD</option>
</select>

<input type="number" id="amount" placeholder="Enter amount">

<label>To:</label>
<select id="toCurrency">
<option value="USD">USD</option>
<option value="EUR">EUR</option>
<option value="GBP">GBP</option>
<option value="INR" selected>INR</option>
<option value="AUD">AUD</option>
</select>

<input type="text" id="result" readonly placeholder="Converted amount">

<button onclick="convertCurrency()">Convert</button>
</div>

<script>
const conversionRates = {
    USD: { EUR: 0.93, GBP: 0.82, INR: 82.74, AUD: 1.47 },
    EUR: { USD: 1.08, GBP: 0.88, INR: 89.06, AUD: 1.58 },
    GBP: { USD: 1.22, EUR: 1.14, INR: 101.5, AUD: 1.80 },
    INR: { USD: 0.012, EUR: 0.011, GBP: 0.0098, AUD: 0.018 },
    AUD: { USD: 0.68, EUR: 0.63, GBP: 0.55, INR: 55.87 }
};

function convertCurrency() {
    const from = document.getElementById("fromCurrency").value;
    const to = document.getElementById("toCurrency").value;
    const amount = document.getElementById("amount").value;
    const resultField = document.getElementById("result");
    const errorField = document.getElementById("error-message");

    errorField.innerText = "";
    resultField.value = "";

    if (amount === "" || amount <= 0) {
        errorField.innerText = "Please enter a valid amount.";
        return;
    }

    if (from === to) {
        errorField.innerText = "Source and Target currencies must be different.";
        return;
    }

    const rate = conversionRates[from][to];
    const convertedAmount = (amount * rate).toFixed(2);

    resultField.value = convertedAmount;
}
</script>

</body>
</html>
