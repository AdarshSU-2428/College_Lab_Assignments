<!DOCTYPE html>
<html>
    <head>
        <title>Advance HTML Concepts</title>
    </head>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: blanchedalmond;
        }
    </style>
    <body>
        <center>
            <table>
                <thead>
                    <tr>
                        <th colspan="4">Class Timetable</th>
                    </tr>
                    <tr>
                        <th>Day</th>
                        <th>9:00 - 11:00</th>
                        <th>11:00 - 1:00</th>
                        <th>2:00 - 4:00</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Monday</td>
                        <td rowspan="2">Computer Networks Lab</td>
                        <td>Mathematics</td>
                        <td>Database</td>
                    </tr>
                    <tr>
                        <td>Tuesday</td>
                        <td>Operatng System</td>
                        <td>Web Technology</td>
                    </tr>
                    <tr>
                        <td>Wednesday</td>
                        <td>Mathematics</td>
                        <td colspan="2">Mini Project</td>
                    </tr>
                    <tr>
                        <td>Thursday</td>
                        <td>Database</td>
                        <td>Operating System</td>
                        <td>Web Technology</td>
                    </tr>
                    <tr>
                        <td>Friday</td>
                        <td colspan="3">Seminar & Workshop</td>
                    </tr>
                </tbody>
            </table>
        </center>
    </body>
</html>
