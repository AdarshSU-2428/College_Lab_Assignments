<!DOCTYPE html>
<html>
<head>
  <style>
    .products-container {
      padding: 20px;
    }

    .products-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .products {
      display: flex;
      justify-content: space-around;
      gap: 20px;
    }

    .product-card {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 15px;
      width: 200px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .product-card img {
      width: 100%;
      height: auto;
      border-radius: 5px;
    }

    .product-card h3 {
      margin: 10px 0;
    }

    .product-card p {
      color: #555;
    }

    .product-card button {
      background-color: blue;
      color: white;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .product-card button:hover {
      background-color: darkblue;
    }
  </style>
</head>
<body>
  <div class="products-container">
    <h2>Featured Products</h2>
    <div class="products">
      <div class="product-card">
        <img src="Photos/Product1.jpg" alt="Product 1">
        <h3>Product 1</h3>
        <p>$20</p>
        <button>Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="Photos/Product2.webp" alt="Product 2">
        <h3>Product 2</h3>
        <p>$30</p>
        <button>Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="Photos/Product3.webp" alt="Product 3">
        <h3>Product 3</h3>
        <p>$40</p>
        <button>Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="Photos/Product4.webp" alt="Product 4">
        <h3>Product 4</h3>
        <p>$50</p>
        <button>Add to Cart</button>
      </div>
    </div>
  </div>
</body>
</html>
